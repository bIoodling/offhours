name: Validate offhours bot
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile bot.py
      - name: Confirm required files exist
        run: test -f requirements.txt && test -f .env.example
